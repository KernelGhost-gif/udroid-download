name: Gojo Dialogue-to-Drop Aura V2

on:
  push:
    branches:
      - amv/gojo-dialogue-aura-v2-20261120
    paths:
      - ".github/workflows/gojo-aura-v2.yml"
      - "amv/gojo-aura-v2/**"

permissions:
  contents: read

concurrency:
  group: gojo-aura-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  render:
    name: Analyze dialogue, map beats, render and QA V2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Install media and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-jpn fonts-noto-cjk fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: amv/gojo-aura-v2/requirements.txt

      - name: Install Python DSP, CV and speech packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r amv/gojo-aura-v2/requirements.txt

      - name: Fetch licensed music and official Gojo source videos
        working-directory: amv/gojo-aura-v2
        run: |
          mkdir -p inputs output
          curl --fail --location --retry 5 --retry-all-errors \
            --output inputs/REACTOR.mp3 \
            https://nolimitsphonk.com/assets/creators/reactor.mp3
          # Source videos must be staged on this branch because GitHub Actions
          # runner IPs are blocked by YouTube's bot-verification gate.
          # Expected paths:
          #   amv/gojo-aura-v2/inputs/gojo_manga_pv.mp4
          #   amv/gojo-aura-v2/inputs/gojo_character_trailer.mp4
          ls -lh inputs
          test -s inputs/REACTOR.mp3
          test -s inputs/gojo_manga_pv.mp4 || {
            echo "::error::Missing inputs/gojo_manga_pv.mp4. Upload the Gojo PV to this branch path and push again."
            exit 1
          }
          test -s inputs/gojo_character_trailer.mp4 || {
            echo "::error::Missing inputs/gojo_character_trailer.mp4. Upload the Gojo character trailer to this branch path and push again."
            exit 1
          }
          for video in inputs/*.mp4; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$video" | grep -q audio
          done

      - name: Render dialogue-led 3-act edit and QA artifacts
        working-directory: amv/gojo-aura-v2
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python render.py --input-dir inputs --output-dir output --duration 22.4
          test -s output/Gojo_Satoru_Aura_Edit_V2.mp4
          ffprobe -v error -show_streams -show_format -of json output/Gojo_Satoru_Aura_Edit_V2.mp4 > output/final_ffprobe.json
          python verify.py output

      - name: Upload complete V2 render and verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-Satoru-Aura-Edit-V2
          path: amv/gojo-aura-v2/output/
          if-no-files-found: warn
          retention-days: 14
